[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-semantic-search"
version = "0.1.0"
description = "Local PDF semantic search ingestion pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.8.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "numpy>=1.26,<3.0",
    "pypdf>=5.0.0,<6.0.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=0.0.1",
    "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
pdf-semantic-search = "pdf_semantic_search.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pdf_semantic_search*"]
